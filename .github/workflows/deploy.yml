name: Deploy r-multicam website
on:
  push:
    branches: [main, 'preview/**']
    paths: ['site/**', 'src/**', 'scripts/**', '.github/workflows/deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r-multicam-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Restore verified media assets
        run: python3 scripts/fetch-assets.py
      - name: Check required website files
        run: |
          test -f site/index.html
          test -f site/config.js
          test -f site/auth/confirmed/index.html
          test -f site/sitemap.xml
      - name: Check bundled CSS and shared layout are up to date
        run: |
          python3 scripts/build-site.py --check
          python3 scripts/check-translation.py
      - name: Check website JavaScript
        run: find site -name '*.js' -exec node --check {} \;
      - name: Check account, checkout and download regressions
        run: |
          node scripts/test-site.cjs
          node scripts/test-plugin-google-relay.cjs
          node scripts/test-pricing.cjs
          node scripts/test-growth.cjs
          node scripts/test-conversion.cjs
          node scripts/test-analytics-edge.cjs
          node scripts/test-release-23112.cjs
          python3 scripts/test-public-23114.py
          python3 scripts/build-plugin-release.py --check
      - name: Deploy existing Cloudflare Pages project
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: '3e561fc2707674ded69117e558d10a9f'
          # main -> production; preview/* branches -> a private preview URL (not indexed by Google)
          command: pages deploy site --project-name=r-multicam --branch=${{ github.ref_name == 'main' && 'main' || format('preview-{0}', github.run_number) }}

name: Engine, plan format and FCPXML
on:
  push:
    branches: [main, 'preview/**']
    paths: ['rp-engine/**', 'plugin/**', 'site/schema/**', '.github/workflows/engine.yml']
  pull_request:
    paths: ['rp-engine/**', 'plugin/**', 'site/schema/**', '.github/workflows/engine.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Syntax check
        run: for f in rp-engine/bin/*.mjs rp-engine/lib/*.mjs rp-engine/test/*.mjs; do node --check "$f"; done
      - name: End-to-end engine, MCP and FCPXML tests
        run: node rp-engine/test/run-tests.mjs
